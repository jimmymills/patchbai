[project]
name = "patchbai"
version = "0.0.1"
description = "A Textual TUI for managing multiple Claude Code agent sessions"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jimmy Mills" }]
dependencies = [
  "textual>=0.80",
  "pydantic>=2.6",
  "claude-agent-sdk>=0.1",
  "tomli-w>=1.0",
  "ptyprocess>=0.7",
  "pyte>=0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  # Pinned so every worktree/agent runs the same pyright as `.venv/bin/pyright`.
  # Without this, `uv run pyright` falls through to whatever pyright is on PATH
  # (homebrew, etc.), which causes inconsistent error sets across machines and
  # — combined with missing dev extras — produces phantom "Import could not be
  # resolved" errors that look like a stale cache. See docs/superpowers/notes/pyright.md.
  "pyright>=1.1.395,<1.2",
]

[project.scripts]
patchbai = "patchbai.__main__:main"
mt = "patchbai.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["patchbai", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patchbai"]
