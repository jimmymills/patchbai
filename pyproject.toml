[project]
name = "mod_tui"
version = "0.0.1"
description = "A Textual TUI for managing multiple Claude Code agent sessions"
requires-python = ">=3.11"
dependencies = [
  "textual>=0.80",
  "pydantic>=2.6",
  "claude-agent-sdk>=0.1",
  "tomli-w>=1.0",
  "ptyprocess>=0.7",
  "pyte>=0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
mod-tui = "mod_tui.__main__:main"
mt = "mod_tui.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["mod_tui", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mod_tui"]
